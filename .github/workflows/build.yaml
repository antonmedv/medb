name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-version: [ '1.23', '1.24', '1.25', '1.26', '1.27' ]
        go-arch: [ '386' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Build
        env:
          GOARCH: ${{ matrix.go-arch }}
        run: |
          go build ./...
          go build -C cmd -o /dev/null ./...

  cross:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        go-os: [ 'windows', 'darwin', 'freebsd' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: Build
        env:
          GOOS: ${{ matrix.go-os }}
        run: |
          go build ./...
          go build -C cmd -o /dev/null ./...
