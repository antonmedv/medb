name: fuzz

on:
  schedule:
    - cron: '17 2 * * *' # nightly
  workflow_dispatch:

permissions: {}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [ 'FuzzValidName', 'FuzzWALReplay', 'FuzzSnapshotLoad' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: go test -run xxx -fuzz "^${TARGET}$" -fuzztime 5m .
      # A found crasher is written to testdata/fuzz/; keep it after the
      # runner is gone so it can be committed as a regression case.
      - name: Upload crasher
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crasher-${{ matrix.target }}
          path: testdata/fuzz/
          if-no-files-found: ignore
